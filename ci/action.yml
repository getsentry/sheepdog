name: Sheepdog classification
description: Give a pull request a danger score from 1 to 10 with classification.model from .github/sheepdog.yml on the base branch.
inputs:
  openrouter-api-key:
    description: The OpenRouter API key.
    required: true
  github-token:
    description: A token that can read the pull request and the contents of the repository.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    # setup-go refuses paths with "..", and it hashes cache files only inside the workspace.
    # The job checks out nothing, so a copy of go.sum in the workspace is safe.
    - name: Find the Sheepdog source
      id: source
      shell: bash
      run: |
        server="$(cd "$GITHUB_ACTION_PATH/../server" && pwd)"
        cp "$server/go.sum" "$GITHUB_WORKSPACE/.sheepdog-go.sum"
        echo "server=$server" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: ${{ steps.source.outputs.server }}/go.mod
        cache-dependency-path: .sheepdog-go.sum
    - name: Build Sheepdog
      shell: bash
      working-directory: ${{ steps.source.outputs.server }}
      run: go build -o "$RUNNER_TEMP/sheepdog" ./cmd/sheepdog
    - name: Classify
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: '"$RUNNER_TEMP/sheepdog" classify --pr "$PR_NUMBER"'
